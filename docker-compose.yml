# OmniRoute — decoupled deployment: headless API backend + static SPA frontend.
#
#   docker compose up --build
#
# Backend : API-only image (dashboard stubbed at build), SQLite volume.
# Frontend: nginx serving the SPA; API base baked via VITE_API_BASE.

services:
  backend:
    build: ./backend
    ports:
      - "20128:20128"
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      API_KEY_SECRET: ${API_KEY_SECRET:-}
      INITIAL_PASSWORD: ${INITIAL_PASSWORD:-CHANGEME}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-info}
    volumes:
      - omniroute-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ${VITE_API_BASE:-}
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  omniroute-data:
