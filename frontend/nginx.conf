server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: hash routing needs only "/", but keep deep-link safe.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Immutable hashed assets.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
